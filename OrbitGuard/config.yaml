# Mission Watch Configuration File
# Edit these settings to customize the application behavior

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  anomalies_dir: "data/anomalies"

# Signal Analyst settings
signal_analyst:
  model_type: "isolation_forest"  # Options: "isolation_forest", "statistical", "ensemble"
  contamination: 0.05  # Expected proportion of anomalies (0.0 to 0.5)
  n_estimators: 100  # Number of trees for Isolation Forest
  anomaly_threshold: 0.7  # Minimum score to classify as anomaly (0.0 to 1.0)
  
# Advisor settings
advisor:
  model_name: "ibm/granite-13b-instruct-v2"
  api_endpoint: "https://us-south.ml.cloud.ibm.com"
  max_tokens: 500
  temperature: 0.3  # Lower = more deterministic, higher = more creative
  
# Dashboard settings
dashboard:
  title: "Mission Watch - Spacecraft Telemetry Triage"
  refresh_interval: 60  # Auto-refresh interval in seconds
  max_anomalies_display: 50  # Maximum anomalies to show in table
  
# Logging
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  log_file: "logs/mission_watch.log"
  log_to_console: true
